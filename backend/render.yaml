# Render blueprint: one web service + one managed PostgreSQL instance.
# Deploy by pointing Render at this repo ("New +" -> "Blueprint").
services:
  - type: web
    name: study-scheduler-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: study-scheduler-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      # After the frontend is on GitHub Pages, set this to your Pages URL,
      # e.g. https://<username>.github.io
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: study-scheduler-db
    plan: free
